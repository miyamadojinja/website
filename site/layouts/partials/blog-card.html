<a href="{{ .RelPermalink }}" class="blog-card">
  <article class="blog-card__surface">
    <p class="blog-card__date">
      {{ partial "date.html" .Date }}
    </p>
    <h2 class="blog-card__title">
      {{ .Title }}
    </h2>
    {{ with .Summary }}
      <p class="blog-card__summary">{{ . }}</p>
    {{ end }}
    {{ with .Params.tags }}
      <div class="blog-card__tags">
        {{ range . }}
          <span class="blog-card__tag">
            {{ . }}
          </span>
        {{ end }}
      </div>
    {{ end }}
  </article>
</a>

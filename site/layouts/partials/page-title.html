{{/*
  Partial: page-title.html

  Purpose:
    Renders a unified page title section.
    This is used across content types like single pages, taxonomy terms, sections, etc.

  Usage:
    {{ partial "page-title.html" . }}

  Dependencies:
    - Expects `.Title` in context.
*/}}

<section class="page-title">
  <div class="page-title__inner">
    <h1 class="page-title__heading">
      {{ .Title }}
    </h1>
  </div>
</section>

<nav class="site-header" aria-label="メインナビゲーション">
  <div class="site-header__inner">
    <!-- Logo -->
    <a href="{{ .Site.BaseURL }}" class="site-header__logo">
      {{ partial "logo" . }}
    </a>
    <!-- Desktop nav items (visible on lg+) -->
    <div class="site-header__desktop-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"
           class="site-header__nav-link">
        {{ .Name }}
      </a>
      {{ end }}
    </div>
    <!-- Mobile menu toggle -->
    <button id="menu-toggle" class="site-header__menu-toggle" type="button" aria-label="メニューを開く" aria-controls="menu" aria-expanded="false">
      <svg class="site-header__menu-icon" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>
  <!-- Mobile nav dropdown -->
  <div id="menu" class="site-header__mobile-nav" hidden>
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}" class="site-header__mobile-link">
      {{ .Name }}
    </a>
    {{ end }}
  </div>
</nav>
